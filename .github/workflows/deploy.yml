name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ingest
            image: imoveis-caixa-ingest
            dockerfile: backend/Dockerfile
          - name: webhook
            image: imoveis-caixa-webhook
            dockerfile: webhook/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  trigger-easypanel:
    name: Trigger EasyPanel
    runs-on: ubuntu-latest
    needs: build-images
    env:
      EASYPANEL_DEPLOY_WEBHOOK_URL: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Trigger deploy webhook
        if: ${{ env.EASYPANEL_DEPLOY_WEBHOOK_URL != '' }}
        run: |
          curl -fsS -X POST "$EASYPANEL_DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"images":["ghcr.io/${{ github.repository_owner }}/imoveis-caixa-ingest:latest","ghcr.io/${{ github.repository_owner }}/imoveis-caixa-webhook:latest"]}'
